name: Build

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Install, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 (only)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify Node version
        run: |
          node -v
          echo "Expected Node 24.x, got $(node -v)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build (if applicable)
        run: npm run build --if-present