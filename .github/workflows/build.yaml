name: Build

on:
  push:
    branches:
      - develop
      - master
      - 'feature/test-ci'
      - 'feature/US*'
      - 'feature/us*'
      - 'feature/de*'
      - 'feature/DE*'
      - 'hotfix'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate Branch Name
    uses: ./.github/workflows/validate-branch-name.yml

  build:
    name: Build
    needs: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24 (only)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify Node version
        run: |
          node -v
          echo "Expected Node 24.x, got $(node -v)"

      - name: Install dependencies
        run: npm ci

      - name: Run build (if applicable)
        run: npm run build --if-present

  call-unit-test:
    name: Unit Test
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/unit-test.yml

  call-docker-build:
    name: Docker Build
    needs: call-unit-test
    if: needs.call-unit-test.result == 'success'
    uses: ./.github/workflows/docker-build.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}